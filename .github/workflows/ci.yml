name: Frontend CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  AWS_REGION: ${{ vars.AWS_REGION || 'mx-central-1' }}
  # Vite only exposes variables prefixed with VITE_ to the browser. This URL is
  # intentionally public and must never contain credentials.
  VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || '' }}

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Secret scan
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest detect --source=/repo --redact --no-git

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high

      - name: Validate production build configuration
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          test -n "${VITE_API_BASE_URL}" || { echo "Missing VITE_API_BASE_URL in GitHub Variables."; exit 1; }

      - name: Build
        run: npm run build

      - name: Upload validated build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Semgrep
        run: semgrep scan --config auto --sarif --output semgrep.sarif

  deploy:
    name: Deploy to S3
    runs-on: ubuntu-latest
    needs:
      - quality
      - semgrep
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Must match the GitHub Environment trusted by the Terraform OIDC role.
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate deploy configuration
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN || '' }}
          S3_BUCKET: ${{ vars.S3_BUCKET || '' }}
        run: |
          test -n "${AWS_ROLE_ARN}" || { echo "Missing AWS_ROLE_ARN in GitHub Variables."; exit 1; }
          test -n "${S3_BUCKET}" || { echo "Missing S3_BUCKET in GitHub Variables."; exit 1; }
          test -n "${VITE_API_BASE_URL}" || { echo "Missing VITE_API_BASE_URL in GitHub Variables."; exit 1; }

      - name: Download validated build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: Validate build artifact
        run: test -f dist/index.html

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync build to S3
        run: aws s3 sync ./dist s3://${{ vars.S3_BUCKET }} --delete

      - name: Invalidate CloudFront
        if: vars.CLOUDFRONT_DISTRIBUTION_ID != ''
        run: aws cloudfront create-invalidation --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} --paths '/*'
