name: Frontend CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  # PR updates supersede earlier validation runs. Main runs remain serialized so
  # a valid deployment is never cancelled while it is updating production state.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "22"
  AWS_REGION: ${{ vars.AWS_REGION || 'mx-central-1' }}
  # Vite only exposes variables prefixed with VITE_ to the browser. This URL is
  # intentionally public and must never contain credentials.
  VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || '' }}

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Secret scan
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest detect --source=/repo --redact --no-git

  quality:
    name: Quality gates
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build

  e2e-smoke:
    name: E2E smoke (Playwright)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # E2E and quality validate the same immutable commit in isolated runners.
    # Keeping them independent puts both gates on the critical path in parallel;
    # branch protection still requires each job to pass before merge.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E smoke
        run: npm run e2e:ci

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  production-build:
    name: Production build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs:
      - secret-scan
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate production build configuration
        run: |
          test -n "${VITE_API_BASE_URL}" || { echo "Missing VITE_API_BASE_URL in GitHub Variables."; exit 1; }

      - name: Build
        run: npm run build

      - name: Generate build info
        run: |
          printf '{"sha":"%s","ref":"%s","built_at":"%s"}\n' \
            "${GITHUB_SHA}" \
            "${GITHUB_REF_NAME}" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > dist/build-info.json

      - name: Upload validated build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  semgrep:
    name: Semgrep SAST
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Semgrep
        run: semgrep scan --config auto

  deploy:
    name: Deploy to S3
    runs-on: ubuntu-latest
    needs:
      - secret-scan
      - production-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Must match the GitHub Environment trusted by the Terraform OIDC role.
    environment: development
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Validate deploy configuration
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN || '' }}
          S3_BUCKET: ${{ vars.S3_BUCKET || '' }}
        run: |
          test -n "${AWS_ROLE_ARN}" || { echo "Missing AWS_ROLE_ARN in GitHub Variables."; exit 1; }
          test -n "${S3_BUCKET}" || { echo "Missing S3_BUCKET in GitHub Variables."; exit 1; }
          test -n "${VITE_API_BASE_URL}" || { echo "Missing VITE_API_BASE_URL in GitHub Variables."; exit 1; }

      - name: Download validated build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: Validate build artifact
        run: |
          test -f dist/index.html || { echo "dist/index.html not found in artifact"; exit 1; }
          test -f dist/build-info.json || { echo "dist/build-info.json not found in artifact"; exit 1; }
          artifact_sha=$(jq -r '.sha' dist/build-info.json)
          test "${artifact_sha}" = "${GITHUB_SHA}" || { echo "Artifact SHA mismatch: expected ${GITHUB_SHA}, got ${artifact_sha}"; exit 1; }

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync versioned assets to S3
        run: |
          aws s3 sync ./dist "s3://${{ vars.S3_BUCKET }}" \
            --delete \
            --exclude "index.html" \
            --exclude "build-info.json" \
            --cache-control "max-age=31536000,immutable"

      - name: Upload index.html and build-info.json
        run: |
          aws s3 cp ./dist/index.html "s3://${{ vars.S3_BUCKET }}/index.html" \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "text/html; charset=utf-8"
          aws s3 cp ./dist/build-info.json "s3://${{ vars.S3_BUCKET }}/build-info.json" \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "application/json"

      - name: Verify deployed revision
        run: |
          aws s3 cp "s3://${{ vars.S3_BUCKET }}/build-info.json" /tmp/deployed-build-info.json
          deployed_sha=$(jq -r '.sha' /tmp/deployed-build-info.json)
          echo "Deployed SHA: ${deployed_sha}"
          test "${deployed_sha}" = "${GITHUB_SHA}" || { echo "SHA mismatch: expected ${GITHUB_SHA}, got ${deployed_sha}"; exit 1; }

      - name: Invalidate CloudFront
        if: vars.CLOUDFRONT_DISTRIBUTION_ID != ''
        run: aws cloudfront create-invalidation --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} --paths '/*'
